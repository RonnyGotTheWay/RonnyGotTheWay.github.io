services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: art_rank
      POSTGRES_USER: art_rank
      POSTGRES_PASSWORD: art_rank_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - art_rank_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U art_rank -d art_rank"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  art_rank_postgres:

